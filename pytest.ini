[pytest]
testpaths = tests

# 默认跑全部，只排除明确标了 slow 的。
#
# 为什么不写成 `-m "core"`：那样任何**没打标记**的新测试会被静默 deselect，
# 而输出仍是「N passed」全绿——一条永不执行的测试比一条慢测试危险得多。
# 反过来（`not slow`）漏标记的代价只是多跑几秒。
#
# --import-mode=prepend 是显式固定下来的：tests/<域>/ 下没有 __init__.py，测试之间
# 用裸模块名引用（`import test_server`、`from conftest import credential`），这套写法
# 依赖 prepend 把各测试目录插进 sys.path。pytest 默认就是 prepend，写出来是为了
# 「谁想改成 importlib 时能先看到这里」——importlib 下那些裸名导入会全部失效。
addopts = -m "not slow" --strict-markers -q --import-mode=prepend

markers =
    core: 必须守住的核心不变量
    slow: 内部有固定等待/超时，明显较慢（默认不跑）
    e2e: 起整套应用走真实请求链路
    network: 通过 mock 模拟上游或传输层
    real_catalog_check: 需要真实的 _stale_catalog（不被 conftest 的 autouse 装置桩掉）

# 测试文件名统一 test_*.py；各功能域目录见 tests/README.md
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
