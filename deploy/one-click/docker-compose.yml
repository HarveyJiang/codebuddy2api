name: workbuddy-oneclick
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/one-click/Dockerfile
    image: local/codebuddy2api:one-click
    container_name: workbuddy-oneclick
    restart: unless-stopped
    ports:
      # 仅监听本机回环；对外提供时请在前面加 HTTPS 反向代理
      - "127.0.0.1:${PORT:-8787}:8787"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?请先运行 deploy.sh 自动生成，或参考 env.example 手动创建 .env}
      CODEBUDDY2OPENAI_KEY: ${CODEBUDDY2OPENAI_KEY:?请先运行 deploy.sh 自动生成，或参考 env.example 手动创建 .env}
      CODEBUDDY_AUTH_DIR: /data/auth
      MANAGEMENT_DATA_DIR: /data/management
      # 界面上的版本标识。留空则显示 unknown；用镜像 tag 填，便于核对线上跑的是哪一次发布。
      WORKBUDDY_IMAGE_TAG: ${WORKBUDDY_IMAGE_TAG:-}
      # 发往上游的客户端标识：X-IDE-Type / X-IDE-Name / User-Agent。
      # 留空回落 WorkBuddy；设为 app_cloud 则上游用量报表按 app_cloud 归类。
      WORKBUDDY_PRODUCT_NAME: ${WORKBUDDY_PRODUCT_NAME:-WorkBuddy}
      TZ: Asia/Shanghai
    volumes:
      - ./data/auth:/data/auth
      - ./data/management:/data/management
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
